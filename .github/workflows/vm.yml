name: vm

# Boots the real Firecracker backend, which the development session cannot do: there is no KVM there.
# The setup action (.github/actions/vm-setup) installs the pinned Firecracker, the pinned kernel and core image,
# builds galahad and galahad-agent, and fills the signatures through the update VM (cached for a week). Then this
# job scans corpus fixtures and a test-time EICAR file through a microVM, runs the whole corpus (P1-P7) and the
# M2 demo through real VMs (test/acceptance/vm_corpus_test.go, demo_test.go), and runs the P8 isolation probes
# (test/acceptance/p8_test.go) in microVMs of their own. Each failure prints ::error:: lines, which show up as
# annotations without reading the job log.
# A green run of this workflow on the tagged commit is what release.yml requires. It runs only on demand (owner
# decision, 2026-10-26): at the end of each milestone and on the commit to be tagged (gh workflow run vm.yml --ref main).
# Pull requests and pushes do not start it, so merges do not wait on it.
#
# Time estimates on a hosted runner (none is measured yet; the first run fills them in): setup about 10 minutes while
# the images are built here (less once the images-* release exists; the signatures are cached), the benign scans
# 3 minutes, the corpus 25 to 40 minutes (about 70 scans of about 20 seconds), the demo 2 minutes and the P8 probes
# 10 minutes, so the whole job is about an hour. The job limit of 150 minutes is far below the 6 hours that GitHub
# allows.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-${{ github.ref }}
  # A run is never cancelled by the next one: release.yml needs the run of the tagged commit.
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'

      - uses: ./.github/actions/vm-setup

      # The agent is found next to the galahad binary: bin/galahad-agent. A benign scan must finish in 2 minutes.
      - name: Scan the benign fixtures (exit 0 within 2 minutes, ClamAV and YARA covered)
        run: |
          for fixture in testdata/corpus/benign-*; do
            MAX_SECONDS=120 WANT_ANALYZERS="clamav yara" scripts/vm/scan.sh "$fixture" 0
          done

      - name: Scan an EICAR file built here (exit 20, GAL-SIG-001 and GAL-AV-001)
        run: scripts/vm/eicar.sh

      - name: Scan a project that runs curl when its folder is opened (exit 20)
        run: scripts/vm/scan.sh testdata/corpus/p1-folderopen-curl 20

      # P1-P7: the whole corpus of corpus_test.go through "galahad scan <path>", with the exit codes and the evidence
      # of the agent alone, plus fake-interview-repo through Git ingest and the P4 PDF through URL ingest. The two
      # ingest cases reach a sinkhole server of the test through the host proxy. Every failing case is annotated.
      - name: Scan the corpus through real VMs (P1-P7)
        timeout-minutes: 80
        run: scripts/vm/vmtest.sh corpus 'TestVMCorpus|TestVMIngest' 75m

      # The demo of docs/milestones/M2.md section 5: doctor, a Git repository, a PDF, a submodule at the
      # metadata address, jobs and report, with the sinkhole in place of GitHub. The same steps run on the fake sandbox
      # in the normal test run, so only the Firecracker run is selected here.
      - name: Run the M2 demo through real VMs
        timeout-minutes: 15
        run: scripts/vm/vmtest.sh demo 'TestDemoM2/firecracker' 10m

      # P8: the isolation probes. A hostile guest and a hostile input stay contained and are reported. The test
      # builds galahad and galahad-agent with the galahadtest tag (the probes exist only there) and runs each
      # probe in its own VM with a 2 minute limit. It takes about 10 minutes: the sleep probe waits for its limit.
      - name: Run the P8 isolation probes
        timeout-minutes: 45
        run: scripts/vm/p8.sh

      # A scan that went wrong may have left a VM behind.
      - name: Stop what is left
        if: always()
        run: pkill -KILL -x firecracker || true
