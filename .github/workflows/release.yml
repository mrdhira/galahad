name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Nothing is released unless the full gate passes on the tagged commit.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - run: make tools
      - run: make gate

  # Nothing is released unless the vm workflow (real Firecracker VMs: the corpus, the demo and the P8 probes) passed
  # on the tagged commit. The job reads the list of workflow runs through the API, so its token has the single
  # scope "actions: read" and nothing else; it does not even check out the code. vm.yml runs only on demand, so
  # dispatch it on the commit you tag and wait for it to be green before you push the tag; if you forgot, start it,
  # wait for it, and run this workflow again.
  vm:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a green vm run on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow vm.yml --commit "$GITHUB_SHA" --status success --limit 1 --json url --jq '.[0].url // empty')
          if [ -z "$green" ]; then
            echo "::error::no green vm run for the tagged commit ${GITHUB_SHA::12}. Run: gh workflow run vm.yml --ref ${GITHUB_REF_NAME}, wait until it is green, then re-run this workflow."
            exit 1
          fi
          echo "vm passed on ${GITHUB_SHA::12}: $green"

  release:
    needs: [gate, vm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'

      # macOS code signing is not needed yet; it is added with the macOS VM backend in M5.
      - name: Build and package
        run: |
          set -euo pipefail
          pkg=github.com/mrdhira/galahad/internal/cli
          ldflags="-s -w -X ${pkg}.version=${GITHUB_REF_NAME} -X ${pkg}.commit=${GITHUB_SHA::12}"
          agentpkg=github.com/mrdhira/galahad/internal/agent
          agentldflags="-s -w -X ${agentpkg}.version=${GITHUB_REF_NAME} -X ${agentpkg}.commit=${GITHUB_SHA::12}"
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="galahad_${GITHUB_REF_NAME}_${os}_${arch}"
              bin=galahad
              agentbin=galahad-agent
              if [ "$os" = windows ]; then
                bin=galahad.exe
                agentbin=galahad-agent.exe
              fi
              stage="dist/${name}"
              mkdir -p "$stage"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "${stage}/${bin}" ./cmd/galahad
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$agentldflags" -o "${stage}/${agentbin}" ./cmd/galahad-agent
              cp LICENSE README.md "$stage/"
              if [ "$os" = windows ]; then
                (cd dist && zip -qr "${name}.zip" "$name")
              else
                tar -C dist -czf "dist/${name}.tar.gz" "$name"
              fi
              rm -rf "$stage"
            done
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      # The guest images are a release of their own (image.yml). The notes link the one this version pins, and the
      # release is not created when that one does not exist, because galahad setup would find nothing to download.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          images_tag=$(jq -r .tag internal/images/pins.json)
          if ! gh release view "$images_tag" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            echo "::error::the release $images_tag, which internal/images/pins.json pins, does not exist; push the tag $images_tag first"
            exit 1
          fi
          notes="Guest images for this version: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${images_tag}. galahad setup downloads them and checks them against the pins in this binary."
          flags=""
          case "$GITHUB_REF_NAME" in
            *-*|v0.*) flags="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes $flags
