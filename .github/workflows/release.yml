name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'

      # macOS code signing is not needed yet; it is added with the macOS VM backend in M5.
      - name: Build and package
        run: |
          set -euo pipefail
          pkg=github.com/mrdhira/galahad/internal/cli
          ldflags="-s -w -X ${pkg}.version=${GITHUB_REF_NAME} -X ${pkg}.commit=${GITHUB_SHA::12}"
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="galahad_${GITHUB_REF_NAME}_${os}_${arch}"
              bin=galahad
              [ "$os" = windows ] && bin=galahad.exe
              stage="dist/${name}"
              mkdir -p "$stage"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "${stage}/${bin}" ./cmd/galahad
              cp LICENSE README.md "$stage/"
              if [ "$os" = windows ]; then
                (cd dist && zip -qr "${name}.zip" "$name")
              else
                tar -C dist -czf "dist/${name}.tar.gz" "$name"
              fi
              rm -rf "$stage"
            done
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in
            *-*|v0.*) flags="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --title "$GITHUB_REF_NAME" --generate-notes $flags
