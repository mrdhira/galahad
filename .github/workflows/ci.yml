name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether a pull request touches anything besides docs. Pushes to main always run in full.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        name: Detect code changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            # The pull_request checkout is the merge commit; its first parent is the base.
            # --no-renames lists both sides of a rename, so moving code into docs/ is seen.
            changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
            printf 'Changed files:\n%s\n' "$changed"
            # Docs-only: every changed path is Markdown under docs/ or .claude/, a skill LICENSE,
            # a top-level Markdown file, LICENSE, .gitignore or the Dependabot config.
            # grep exit 1 means no other path; exit 2 (an error) keeps code=true.
            if [ -n "$changed" ]; then
              rc=0
              printf '%s\n' "$changed" | grep -Ev '^((docs|\.claude)/.+\.md|\.claude/skills/[^/]+/LICENSE|[^/]+\.md|LICENSE|\.gitignore|\.github/dependabot\.yml)$' >/dev/null || rc=$?
              if [ "$rc" -eq 1 ]; then code=false; fi
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # The jobs always run so the required checks report; only an exact code=false skips their steps.
  # If the changes job fails, the output is empty and everything runs in full.
  gate:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.code == 'false'
        run: echo "Docs-only change, gate skipped."
      - if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code != 'false'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - if: needs.changes.outputs.code != 'false'
        run: make tools
      # The failing gate step and its error lines also go to annotations, which are readable
      # without the job log.
      - if: needs.changes.outputs.code != 'false'
        run: |
          set -o pipefail
          make gate 2>&1 | tee gate.log && exit 0
          { grep -E '^== ' gate.log | tail -n 1
            grep -E -- '--- FAIL|^FAIL|^panic:|\.go:[0-9]+:|^Vulnerability #' gate.log | head -n 9
          } | sed 's/^/::error::/'
          exit 1

  # Build and test only. The full gate runs on Linux.
  test:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: needs.changes.outputs.code == 'false'
        run: echo "Docs-only change, tests skipped."
        shell: bash
      - if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code != 'false'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - if: needs.changes.outputs.code != 'false'
        run: go vet ./...
        shell: bash
      # Failing test names also go to annotations, which are readable without the job log.
      - if: needs.changes.outputs.code != 'false'
        run: |
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee test.log && exit 0
          grep -E -- '--- FAIL|^FAIL|^panic:|_test\.go:[0-9]+:' test.log | head -n 10 | sed 's/^/::error::/'
          exit 1
        shell: bash
