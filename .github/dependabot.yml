version: 2
updates:
  # Go modules: only golang.org/x/* is allowed (see CLAUDE.md); updates keep them current.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      golang-x:
        patterns: ["golang.org/x/*"]

  # Pinned GitHub Actions SHAs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
